<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Product Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-content">
                <div class="header-title">
                    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2"></path>
                        <path d="M12 20v2"></path>
                        <path d="m4.93 4.93 1.41 1.41"></path>
                        <path d="m17.66 17.66 1.41 1.41"></path>
                        <path d="M2 12h2"></path>
                        <path d="M20 12h2"></path>
                        <path d="m6.34 17.66-1.41 1.41"></path>
                        <path d="m19.07 4.93-1.41 1.41"></path>
                    </svg>
                    <h1>Solar Product Marketplace</h1>
                </div>
                
                <!-- Search Bar -->
                <div class="search-container">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search solar products, companies, or categories..."
                    />
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="layout">
                <!-- Filters Sidebar -->
                <div class="sidebar">
                    <div class="filter-box">
                        <div class="filter-header">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                            </svg>
                            <h2>Filters</h2>
                        </div>

                        <!-- Category Filter -->
                        <div class="filter-section">
                            <h3>Category</h3>
                            <div id="categoryButtons" class="category-buttons"></div>
                        </div>

                        <!-- State Filter -->
                        <div class="filter-section">
                            <h3>State</h3>
                            <select id="stateSelect" class="filter-select"></select>
                        </div>

                        <!-- Rating Filter -->
                        <div class="filter-section">
                            <h3>Minimum Rating</h3>
                            <input type="range" id="ratingSlider" min="0" max="5" step="0.5" value="0" class="rating-slider">
                            <div class="rating-labels">
                                <span>Any</span>
                                <span id="ratingValue" class="rating-value">0+ ⭐</span>
                            </div>
                        </div>

                        <!-- Sort -->
                        <div class="filter-section">
                            <h3>Sort By</h3>
                            <select id="sortSelect" class="filter-select">
                                <option value="rating">Highest Rating</option>
                                <option value="reviews">Most Reviews</option>
                                <option value="price">Price: Low to High</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Products Grid -->
                <div class="products-section">
                    <div class="products-header">
                        <p class="products-count">
                            <span id="productCount">0</span> products found
                        </p>
                    </div>

                    <div id="productsContainer" class="products-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="old_script.js"></script>
</body>
</html>
